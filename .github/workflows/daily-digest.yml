name: Daily AI brief (4 AM IST)

on:
  schedule:
    # GitHub cron uses UTC. 22:30 UTC = 04:00 IST (Asia/Kolkata).
    - cron: "30 22 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Rebuild today's digest even if it already exists"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: ai-news-agent
  cancel-in-progress: false

env:
  CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
  GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
  REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
  REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
  CLAUDE_TOKEN_CREATED: ${{ vars.CLAUDE_TOKEN_CREATED }}
  CLAUDE_CODE_MODEL: ${{ vars.CLAUDE_CODE_MODEL }}
  GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
  DIGEST_TIMEZONE: ${{ vars.DIGEST_TIMEZONE }}
  MAX_STORIES: ${{ vars.MAX_STORIES }}
  MIN_STORIES: ${{ vars.MIN_STORIES }}
  MAX_PER_COMPANY: ${{ vars.MAX_PER_COMPANY }}
  INDIA_SHARE: ${{ vars.INDIA_SHARE }}
  MIN_TAMIL_NADU: ${{ vars.MIN_TAMIL_NADU }}
  MAX_WEB_SEARCHES: ${{ vars.MAX_WEB_SEARCHES }}
  MUST_KNOW: ${{ vars.MUST_KNOW }}

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Install Claude Code
        if: env.CLAUDE_CODE_OAUTH_TOKEN != ''
        run: npm install -g @anthropic-ai/claude-code
      - name: Gather news, run the editor, save the edition
        run: python -m ai_news_agent daily ${{ inputs.force && '--force' || '' }}
      - name: Save the edition
        run: |
          git config user.name "ai-news-agent"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/state.json data/digests
          git diff --cached --quiet || git commit -m "Morning Brief $(TZ=Asia/Kolkata date +%F)"
          git pull --rebase && git push
