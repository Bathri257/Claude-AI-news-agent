name: Fetch AI news (4 AM)

on:
  schedule:
    # GitHub cron uses UTC. 22:30 UTC = 04:00 IST (Asia/Kolkata), the previous UTC day.
    - cron: "30 22 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Rebuild today's digest even if it already exists"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: ai-news-agent
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Fetch, summarise and build site
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DIGEST_TIMEZONE: ${{ vars.DIGEST_TIMEZONE }}
          MAX_STORIES: ${{ vars.MAX_STORIES }}
          SITE_URL: ${{ vars.SITE_URL }}
        run: python -m ai_news_agent fetch ${{ inputs.force && '--force' || '' }}
      - name: Commit digest and website
        run: |
          git config user.name "ai-news-agent"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data docs
          git diff --cached --quiet || git commit -m "Daily AI digest $(date -u +%F)"
          git pull --rebase && git push
