name: Scan AI news (every 4 hours)

on:
  schedule:
    # UTC times = 08:00, 12:00, 16:00, 20:00 and 00:00 IST. The 04:00 IST scan is part of the fetch job.
    - cron: "30 2,6,10,14,18 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ai-news-agent
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Gather and triage new articles
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_MODEL: ${{ vars.CLAUDE_MODEL }}
          TRIAGE_MODEL: ${{ vars.TRIAGE_MODEL }}
          DIGEST_TIMEZONE: ${{ vars.DIGEST_TIMEZONE }}
        run: python -m ai_news_agent scan
      - name: Save the story pool
        run: |
          git config user.name "ai-news-agent"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "Scan $(date -u '+%F %H:%M') UTC"
          git pull --rebase && git push
