name: Email AI news (8 AM)

on:
  schedule:
    # Starts at 01:35 UTC = 07:05 IST, then waits until exactly 08:00 local time.
    # (GitHub can start scheduled jobs late, so we begin early and sleep.)
    - cron: "35 1 * * *"
  workflow_dispatch:
    inputs:
      wait:
        description: "Wait until the configured send time"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: ai-news-agent
  cancel-in-progress: false

jobs:
  email:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Send digest email
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          SMTP_HOST: ${{ vars.SMTP_HOST }}
          SMTP_PORT: ${{ vars.SMTP_PORT }}
          CLAUDE_MODEL: ${{ vars.CLAUDE_MODEL }}
          TRIAGE_MODEL: ${{ vars.TRIAGE_MODEL }}
          DIGEST_TIMEZONE: ${{ vars.DIGEST_TIMEZONE }}
          MAX_STORIES: ${{ vars.MAX_STORIES }}
          MIN_STORIES: ${{ vars.MIN_STORIES }}
          MAX_PER_COMPANY: ${{ vars.MAX_PER_COMPANY }}
          INDIA_SHARE: ${{ vars.INDIA_SHARE }}
          MIN_TAMIL_NADU: ${{ vars.MIN_TAMIL_NADU }}
          SITE_URL: ${{ vars.SITE_URL }}
        run: python -m ai_news_agent email ${{ (github.event_name == 'schedule' || inputs.wait) && '--wait' || '' }}
      - name: Commit digest if it had to be built now
        run: |
          git config user.name "ai-news-agent"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data docs
          git diff --cached --quiet || git commit -m "Daily AI digest $(date -u +%F) (built at send time)"
          git pull --rebase && git push
