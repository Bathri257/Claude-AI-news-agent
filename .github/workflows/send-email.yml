name: Email AI digest (8 AM IST)

on:
  schedule:
    # 02:15 UTC = 07:45 IST; the job then waits until exactly 08:00 IST.
    - cron: "15 2 * * *"
  workflow_dispatch:
    inputs:
      wait:
        description: "Wait until the configured send time"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: ai-news-agent
  cancel-in-progress: false

env:
  SMTP_USER: ${{ secrets.SMTP_USER }}
  SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
  EMAIL_TO: ${{ secrets.EMAIL_TO }}
  SMTP_HOST: ${{ vars.SMTP_HOST }}
  SMTP_PORT: ${{ vars.SMTP_PORT }}
  DIGEST_TIMEZONE: ${{ vars.DIGEST_TIMEZONE }}
  SITE_URL: ${{ vars.SITE_URL }}
  # Only used if the 4 AM run failed and the digest must be built now:
  CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
  GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
  CLAUDE_CODE_MODEL: ${{ vars.CLAUDE_CODE_MODEL }}
  GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
  MAX_STORIES: ${{ vars.MAX_STORIES }}
  MIN_STORIES: ${{ vars.MIN_STORIES }}
  MAX_PER_COMPANY: ${{ vars.MAX_PER_COMPANY }}
  INDIA_SHARE: ${{ vars.INDIA_SHARE }}
  MIN_TAMIL_NADU: ${{ vars.MIN_TAMIL_NADU }}
  MAX_WEB_SEARCHES: ${{ vars.MAX_WEB_SEARCHES }}

jobs:
  email:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Install Claude Code (only if today's digest is missing)
        run: |
          if [ ! -f "data/digest-$(TZ=${DIGEST_TIMEZONE:-Asia/Kolkata} date +%F).json" ] && [ -n "$CLAUDE_CODE_OAUTH_TOKEN" ]; then
            npm install -g @anthropic-ai/claude-code
          fi
      - name: Send digest email
        run: python -m ai_news_agent email ${{ (github.event_name == 'schedule' || inputs.wait) && '--wait' || '' }}
      - name: Commit digest if it had to be built now
        run: |
          git config user.name "ai-news-agent"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/state.json data/digest-*.json docs/index.html docs/archive.html docs/days docs/.nojekyll 2>/dev/null || true
          git diff --cached --quiet || git commit -m "AI digest $(TZ=Asia/Kolkata date +%F) (built at send time)"
          git pull --rebase && git push
