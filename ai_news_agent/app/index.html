<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>The Morning Brief</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&family=Inter:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{--paper:#f7f2e8;--card:#fffdf8;--ink:#2a2420;--soft:#6b6058;--faint:#a3978c;--rule:#e3d9c8;
--accent:#b4441c;--accent-soft:#f6e3d6;--tn:#8a5a00;--tn-soft:#fbecc8;--opp:#1f5f5b;--opp-soft:#dcefe9;
--pos:#2f6b3f;--pos-soft:#e1efe2;--mix:#8a6400;--mix-soft:#f6ebcc;--neg:#9b2f2f;--neg-soft:#f6dede;
--serif:"Source Serif 4",Georgia,serif;--display:"Fraunces",Georgia,serif;--ui:Inter,-apple-system,"Segoe UI",Roboto,sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--paper:#1c1916;--card:#24201c;--ink:#ece3d5;--soft:#b3a796;
--faint:#7d7266;--rule:#3a332c;--accent:#e98a5c;--accent-soft:#3d2a1f;--tn:#f0c46a;--tn-soft:#3b3020;--opp:#7fd1c4;--opp-soft:#1d3532;
--pos:#8fcf9c;--pos-soft:#1f3326;--mix:#e8c46b;--mix-soft:#3a3120;--neg:#ee9a9a;--neg-soft:#3d2424}}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--paper);color:var(--ink);font:18px/1.65 var(--serif);-webkit-font-smoothing:antialiased}
a{color:inherit}
button{font:inherit;color:inherit}
.wrap{max-width:760px;margin:0 auto;padding:24px 16px 90px}
/* masthead */
.mast{text-align:center;border-bottom:3px double var(--ink);padding-bottom:12px}
.hello{font:italic 17px/1.4 var(--serif);color:var(--soft);margin:0 0 4px}
.mast h1{font:700 clamp(36px,8.5vw,58px)/1 var(--display);letter-spacing:-.02em;margin:0;cursor:pointer}
.edline{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:12px;padding-top:8px;
border-top:1px solid var(--ink);font:500 12px/1.4 var(--ui);letter-spacing:.06em;text-transform:uppercase;color:var(--soft)}
.edline .nav{display:flex;align-items:center;gap:6px}
.edline button{background:none;border:1px solid var(--rule);border-radius:6px;width:28px;height:26px;cursor:pointer;color:var(--soft)}
.edline button:disabled{opacity:.3;cursor:default}
.status{border:0!important;width:auto!important;display:inline-flex;align-items:center;gap:6px;font:600 12px var(--ui)!important;
letter-spacing:.02em;text-transform:none}
.dot{width:8px;height:8px;border-radius:50%;background:var(--pos)}
.dot.warn{background:var(--mix)}.dot.bad{background:var(--neg)}
/* tabs + search */
.bar{display:flex;align-items:center;gap:14px;margin:14px 0 4px;border-bottom:1px solid var(--rule);flex-wrap:wrap}
.tabs{display:flex;gap:20px;flex:1;overflow-x:auto;scrollbar-width:none}
.tabs a{font:600 14.5px var(--ui);text-decoration:none;color:var(--soft);padding:10px 1px 12px;border-bottom:3px solid transparent;
margin-bottom:-1px;white-space:nowrap}
.tabs a.on{color:var(--ink);border-color:var(--accent)}
.search{position:relative;margin-bottom:6px}
.search input{width:190px;font:500 14px var(--ui);padding:7px 10px 7px 30px;border:1px solid var(--rule);border-radius:99px;
background:var(--card);color:var(--ink)}
.search:before{content:"⌕";position:absolute;left:11px;top:4px;font:18px var(--ui);color:var(--faint)}
/* sections */
.section{display:flex;align-items:center;gap:12px;margin:38px 0 4px;font:700 12.5px var(--ui);letter-spacing:.14em;
text-transform:uppercase;color:var(--accent)}
.section:after{content:"";flex:1;border-top:1px solid var(--rule)}
.section small{font-weight:500;letter-spacing:0;text-transform:none;color:var(--faint)}
.lede{font-style:italic;color:var(--soft);margin:6px 0 0;font-size:16.5px}
/* banner */
.banner{margin:18px 0 0;padding:12px 16px;border-radius:10px;background:var(--mix-soft);color:var(--ink);font:500 14px/1.55 var(--ui)}
.banner.bad{background:var(--neg-soft)}
.banner b{display:block;margin-bottom:2px}
.health{margin:10px 0 0;padding:12px 16px;border:1px solid var(--rule);border-radius:10px;font:500 13.5px/1.7 var(--ui);color:var(--soft)}
/* opportunities */
.opps{margin-top:26px;background:var(--opp-soft);border-radius:14px;padding:16px 18px 6px}
.opps h3{margin:0 0 4px;font:700 12.5px var(--ui);letter-spacing:.14em;text-transform:uppercase;color:var(--opp)}
.opp{padding:10px 0 12px;border-top:1px solid color-mix(in srgb,var(--opp) 20%,transparent)}
.opp:first-of-type{border-top:0}
.opp .t{font:600 18px/1.35 var(--display)}
.opp .t a{text-decoration:none}.opp .t a:hover{text-decoration:underline}
.opp .d{font-size:16px;margin-top:2px}
.opp .m{font:600 12px var(--ui);color:var(--opp);margin-top:4px}
/* stories */
.story{display:grid;grid-template-columns:44px 1fr;gap:0 14px;padding:22px 0;border-bottom:1px solid var(--rule)}
.num{font:600 26px/1 var(--display);color:var(--faint);padding-top:4px}
.kicker{font:600 11.5px/1.4 var(--ui);letter-spacing:.1em;text-transform:uppercase;color:var(--accent)}
.badge{display:inline-block;border-radius:3px;padding:1px 6px;margin-left:6px;letter-spacing:.06em}
.badge.tn{color:var(--tn);background:var(--tn-soft)}
.badge.upd{color:var(--opp);background:var(--opp-soft)}
.story h2{font:600 24px/1.25 var(--display);letter-spacing:-.01em;margin:6px 0 8px}
.story.first h2{font-size:31px}
.story.first .summary:first-letter{float:left;font:700 54px/.85 var(--display);padding:6px 8px 0 0;color:var(--accent)}
.summary{margin:0}
.byline{display:flex;flex-wrap:wrap;gap:6px 16px;align-items:center;margin-top:10px;font:500 13px/1.5 var(--ui);color:var(--soft)}
.more{color:var(--accent);font-weight:600;text-decoration:none}.more:hover{text-decoration:underline}
.linkish{background:none;border:0;padding:0;cursor:pointer;font:600 13px var(--ui);color:var(--opp)}
.linkish:hover{text-decoration:underline}
.votes{display:flex;gap:6px;margin-top:12px}
.votes button{border:1px solid var(--rule);background:var(--card);border-radius:99px;padding:3px 11px;cursor:pointer;
font:500 12.5px var(--ui);color:var(--soft)}
.votes button.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
/* quick hits */
.quick{padding:14px 0;border-bottom:1px solid var(--rule);display:grid;grid-template-columns:44px 1fr;gap:0 14px;cursor:pointer}
.quick .num{font-size:19px;padding-top:2px}
.quick h4{margin:0;font:600 18px/1.35 var(--display)}
.quick .brief{margin:2px 0 0;color:var(--soft);font-size:16px}
.quick .meta{font:500 11.5px var(--ui);letter-spacing:.06em;text-transform:uppercase;color:var(--faint);margin-top:4px}
.quick .open{display:none;cursor:auto}
.quick.expanded .open{display:block;margin-top:10px}
.quick.expanded .brief{display:none}
/* storyline timeline */
.timeline{margin:14px 0 2px;padding:4px 0 0 18px;border-left:2px solid var(--opp-soft);display:none}
.timeline.show{display:block}
.tl{position:relative;padding:0 0 14px}
.tl:before{content:"";position:absolute;left:-24px;top:8px;width:10px;height:10px;border-radius:50%;background:var(--opp)}
.tl .when{font:600 11.5px var(--ui);letter-spacing:.08em;text-transform:uppercase;color:var(--opp)}
.tl .h{font:600 17px/1.35 var(--display);margin:1px 0}
.tl .h a{text-decoration:none}.tl .h a:hover{text-decoration:underline}
.tl p{margin:2px 0;font-size:15.5px;color:var(--soft)}
.tl .said{margin-top:6px;padding:8px 12px;background:var(--card);border:1px solid var(--rule);border-radius:4px 12px 12px 12px;font-size:15px}
.tl.now:before{background:var(--accent)}
.tl p .more{font:600 12.5px var(--ui);margin-left:4px}
.tl .quote p{color:var(--ink)}
/* reviews */
.chip{display:inline-block;font:600 11.5px/1 var(--ui);border-radius:99px;padding:5px 9px;margin-right:6px}
.chip.positive{color:var(--pos);background:var(--pos-soft)}.chip.mixed{color:var(--mix);background:var(--mix-soft)}
.chip.negative{color:var(--neg);background:var(--neg-soft)}.chip.none{color:var(--soft);background:var(--rule)}
.people{padding:24px 0;border-bottom:1px solid var(--rule)}
.people h3{font:600 21px/1.3 var(--display);margin:4px 0 8px}
.people .from{font:600 11.5px var(--ui);letter-spacing:.08em;text-transform:uppercase;color:var(--faint)}
.pulse{font-style:italic;color:var(--soft);margin:8px 0 12px}
.quote{background:var(--card);border:1px solid var(--rule);border-radius:4px 16px 16px 16px;padding:14px 16px 12px;margin:12px 0}
.quote p{margin:0;font-size:17px}
.quote p:before{content:"“";font:700 30px/0 var(--display);color:var(--accent);vertical-align:-10px;margin-right:2px}
.quote .gist{font:500 13.5px/1.5 var(--ui);color:var(--soft);margin-top:8px}
.quote .who{display:flex;justify-content:space-between;flex-wrap:wrap;gap:4px 12px;margin-top:8px;font:500 12px var(--ui);color:var(--faint)}
.quote .who a{color:var(--accent);text-decoration:none}
/* lists */
.list{list-style:none;padding:0;margin:18px 0}
.list li{padding:14px 0;border-bottom:1px solid var(--rule)}
.list a{text-decoration:none;display:block}
.list .d{font:600 11.5px var(--ui);letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.list .h{display:block;font:600 19px/1.35 var(--display);margin-top:3px}
.list .s{display:block;color:var(--soft);font-size:15.5px;margin-top:2px}
.recap{font-size:19px;line-height:1.7;margin:18px 0 6px}
.recap:first-letter{float:left;font:700 58px/.85 var(--display);padding:6px 8px 0 0;color:var(--accent)}
.empty{text-align:center;color:var(--soft);padding:56px 12px;font-style:italic}
mark{background:var(--tn-soft);color:inherit;padding:0 2px;border-radius:2px}
footer{margin-top:44px;padding-top:14px;border-top:3px double var(--ink);font:500 12.5px/1.7 var(--ui);color:var(--faint);text-align:center}
@media (max-width:560px){.edline{flex-wrap:wrap}#meta{order:3;width:100%;text-align:center;padding-top:2px}
body{font-size:17px}.story,.quick{grid-template-columns:30px 1fr;gap:0 10px}.num{font-size:20px}
.story h2{font-size:21px}.story.first h2{font-size:25px}.search,.search input{width:100%}.bar{gap:6px}}
</style>
</head>
<body>
<div class="wrap">
  <header class="mast">
    <p class="hello" id="hello"></p>
    <h1 onclick="go('#/')">The Morning Brief</h1>
    <div class="edline">
      <div class="nav"><button id="prev" title="Previous day">‹</button><span id="when"></span><button id="next" title="Next day">›</button></div>
      <span id="meta"></span>
      <button class="status" id="status"><span class="dot"></span><span>…</span></button>
    </div>
  </header>
  <div class="bar">
    <nav class="tabs" id="tabs">
      <a href="#/" data-t="today">Today</a>
      <a href="#/people" data-t="people">What people said</a>
      <a href="#/storylines" data-t="storylines">Storylines</a>
      <a href="#/week" data-t="week">This week</a>
      <a href="#/archive" data-t="archive">Archive</a>
    </nav>
    <label class="search"><input id="q" type="search" placeholder="Search everything" aria-label="Search all stories"></label>
  </div>
  <div id="healthbox"></div>
  <main id="view"><p class="empty">Loading…</p></main>
  <footer>Your private news agent · gathered while you slept · reviews are real comments, quoted word for word</footer>
</div>
<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const url = u => /^https?:\/\//.test(u || "") ? esc(u) : "#";
const fmt = (d, opts) => new Date(d + "T00:00:00").toLocaleDateString("en-IN", opts || {weekday:"long", day:"numeric", month:"long", year:"numeric"});
const short = d => fmt(d, {day:"numeric", month:"short"});
const SENT = {positive:"Mostly positive", mixed:"Mixed feelings", negative:"Skeptical", none:"Quiet so far"};
let INDEX = null, DAY = null, CUR = null;

async function api(path, opts) { const r = await fetch(path, opts); if (!r.ok) throw new Error(r.status); return r.json(); }
function go(h) { location.hash = h; }

function greet() {
  const h = new Date().getHours();
  $("#hello").textContent = (h < 12 ? "Good morning." : h < 17 ? "Good afternoon." : "Good evening.") +
    " Here's what happened in AI while you slept.";
}

/* ---------- pieces ---------- */
function kicker(s) {
  const tn = s.india === "tamil_nadu" ? '<span class="badge tn">Tamil Nadu</span>' : "";
  const day = s.storyline && s.storyline.days > 1 ? `<span class="badge upd">Update · day ${s.storyline.day}</span>` : "";
  return `<div class="kicker">${[s.category, s.technology].filter(Boolean).map(esc).join(" · ")}${tn}${day}</div>`;
}
function votes(id) {
  const v = INDEX.feedback[id];
  const b = (k, label) => `<button class="${v === k ? "on" : ""}" onclick="vote(event,'${id}','${k}')">${label}</button>`;
  return `<div class="votes">${b("up","👍 Useful")}${b("down","👎 Not for me")}${b("more","✨ More like this")}</div>`;
}
function reactionBlock(r, compact) {
  if (!r || (!r.reviews?.length && !r.pulse)) return "";
  const chip = r.auto ? "" : `<span class="chip ${esc(r.sentiment)}">${SENT[r.sentiment] || ""}</span>`;
  if (compact) {
    const q = r.reviews?.[0];
    return `<div class="said">💬 ${chip}${esc(r.pulse || "")}${q ? `<br><i>“${esc(q.quote)}”</i> <a class="more" href="${url(q.link)}" target="_blank" rel="noopener">${esc(q.community)} ↗</a>` : ""}</div>`;
  }
  return `${chip}${r.pulse ? `<p class="pulse">${esc(r.pulse)}</p>` : ""}` + (r.reviews || []).map(q => `
    <div class="quote"><p>${esc(q.quote)}</p>${q.takeaway ? `<div class="gist">In short: ${esc(q.takeaway)}</div>` : ""}
    <div class="who"><span>${esc([...new Set([q.platform, q.community].filter(Boolean))].join(" · "))}${q.platform === "Reddit" && q.score ? " · ▲ " + esc(q.score) : ""}</span>
    <a href="${url(q.link)}" target="_blank" rel="noopener">See the conversation ↗</a></div></div>`).join("");
}
function timeline(s) {
  const items = s.storyline?.items || [];
  if (!items.length) return "";
  const rows = items.map(m => `<div class="tl"><div class="when">${short(m.date)}${m.date > s.date ? " · later" : ""}</div>
    <div class="h"><a href="${url(m.link)}" target="_blank" rel="noopener">${esc(m.headline)}</a></div>
    <p>${esc(m.brief || "")} <a class="more" href="#/day/${m.date}/${m.id}">open</a></p>${reactionBlock(m.reactions, true)}</div>`).join("");
  const before = items.filter(m => m.date <= s.date).length, after = items.length - before;
  const count = [before && `${before} earlier`, after && `${after} later`].filter(Boolean).join(", ");
  return `<button class="linkish" onclick="toggleTl(event,'${s.id}')">🧵 The story so far: ${esc(s.thread)} (${count} report${items.length > 1 ? "s" : ""})</button>
    <div class="timeline" id="tl-${s.id}">${rows}<div class="tl now"><div class="when">${short(s.date)} · this story</div></div></div>`;
}
function byline(s) {
  const also = s.also_covered_by?.length ? ` · also in ${s.also_covered_by.length} other outlet${s.also_covered_by.length > 1 ? "s" : ""}` : "";
  return `<div class="byline"><span>${esc(s.source)}${also}</span><a class="more" href="${url(s.link)}" target="_blank" rel="noopener">Read the full story →</a></div>`;
}
function mustCard(s, n) {
  return `<article class="story${n === 1 ? " first" : ""}" id="s-${s.id}"><div class="num">${String(n).padStart(2,"0")}</div><div>
    ${kicker(s)}<h2>${esc(s.headline)}</h2><p class="summary">${esc(s.summary)}</p>${byline(s)}${timeline(s)}${votes(s.id)}</div></article>`;
}
function quickRow(s, n) {
  return `<div class="quick" id="s-${s.id}" onclick="expand(event,this)"><div class="num">${String(n).padStart(2,"0")}</div><div>
    <h4>${esc(s.headline)}</h4><p class="brief">${esc(s.brief)}</p>
    <div class="meta">${esc(s.category)}${s.india === "tamil_nadu" ? " · Tamil Nadu" : ""}${s.storyline?.days > 1 ? " · update" : ""}</div>
    <div class="open"><p class="summary">${esc(s.summary)}</p>${byline(s)}${timeline(s)}${votes(s.id)}</div></div></div>`;
}

/* ---------- views ---------- */
function healthBanner(d) {
  const h = d.health || {}, msgs = [];
  if (h.token_warning) msgs.push(["bad", "Claude token", h.token_warning]);
  if (h.editor && h.editor !== "claude-code")
    msgs.push(["", "Today's edition used a backup editor", `${h.editor === "gemini" ? "Gemini" : "Plain extracts (no AI)"} was used because Claude Code wasn't available. ${esc(h.editor_problem || "")}`]);
  if (h.sources?.failing?.length) msgs.push(["", "Some news sources are failing", h.sources.failing.map(esc).join(", ")]);
  if (h.reviews?.reddit === "failing") msgs.push(["", "Reddit isn't answering", "Add the free Reddit app key (see README) for reliable reviews."]);
  return msgs.map(([cls, t, m]) => `<div class="banner ${cls}"><b>${t}</b>${m}</div>`).join("");
}
function setStatus(d) {
  const h = d?.health || {}, el = $("#status"), dot = el.querySelector(".dot");
  let level = "", text = "All good";
  if (h.sources?.failing?.length || h.reviews?.reddit === "failing") { level = "warn"; text = "Partly degraded"; }
  if (h.editor && h.editor !== "claude-code") { level = "warn"; text = "Backup editor used"; }
  if (h.token_warning) { level = "bad"; text = "Needs attention"; }
  if (!d) text = INDEX?.sync?.status || "";
  dot.className = "dot " + level; el.lastElementChild.textContent = text;
  el.onclick = () => {
    const box = $("#healthbox");
    if (box.innerHTML) { box.innerHTML = ""; return; }
    const s = h.sources || {}, r = h.reviews || {};
    box.innerHTML = `<div class="health">Editor: <b>${esc(h.editor || "–")}</b> · Sources: <b>${esc(s.ok ?? "–")}/${esc(s.total ?? "–")}</b> working ·
      Hacker News: <b>${esc(r.hacker_news || "–")}</b> · Reddit: <b>${esc(r.reddit || "–")}</b> (${esc(r.reddit_mode || "")}) ·
      Sync: <b>${esc(INDEX.sync.status)}</b> <button class="linkish" onclick="sync()">sync now</button>
      ${d ? `<br>Scanned ${esc(d.articles_scanned)} new articles, ${esc(d.candidates)} made the shortlist.` : ""}</div>`;
  };
}
function header(d) {
  const i = INDEX.days.findIndex(x => x.date === d.date);
  $("#when").textContent = fmt(d.date);
  const words = d.stories.reduce((a, s) => a + (s.tier === "must" ? s.summary.split(" ").length : s.brief.split(" ").length) + 12, 0);
  $("#meta").textContent = `No. ${INDEX.days.length - i} · ${d.stories.length} stories · ${Math.max(1, Math.round(words / 220))} min`;
  $("#prev").disabled = i >= INDEX.days.length - 1; $("#next").disabled = i <= 0;
  $("#prev").onclick = () => go(`#/day/${INDEX.days[i + 1].date}`);
  $("#next").onclick = () => go(i - 1 === 0 ? "#/" : `#/day/${INDEX.days[i - 1].date}`);
  setStatus(d);
}
function viewToday(d, focus) {
  const must = d.stories.filter(s => s.tier === "must"), quick = d.stories.filter(s => s.tier !== "must");
  let n = 0, html = healthBanner(d);
  if (d.opportunities?.length) html += `<section class="opps"><h3>For you · opportunities</h3>` + d.opportunities.map(o =>
    `<div class="opp"><div class="t"><a href="${url(o.link)}" target="_blank" rel="noopener">${esc(o.title)} ↗</a></div>
     <div class="d">${esc(o.detail)}</div><div class="m">${[o.where, o.deadline && "Deadline: " + o.deadline].filter(Boolean).map(esc).join(" · ")}</div></div>`).join("") + `</section>`;
  html += `<h3 class="section">Must know <small>${must.length}</small></h3>` + must.map(s => mustCard(s, ++n)).join("");
  const world = quick.filter(s => s.india === "none"), home = quick.filter(s => s.india !== "none");
  if (world.length) html += `<h3 class="section">Quick hits · around the world <small>${world.length}</small></h3>` + world.map(s => quickRow(s, ++n)).join("");
  if (home.length) html += `<h3 class="section">Quick hits · closer to home <small>${home.length}</small></h3>` + home.map(s => quickRow(s, ++n)).join("");
  $("#view").innerHTML = html;
  if (focus) { const el = document.getElementById("s-" + focus); if (el) { el.classList.add("expanded"); el.scrollIntoView({block:"start"}); } }
}
function viewPeople(d) {
  const list = d.reviewed || [];
  let html = `<p class="lede">Reviews arrive a day after the news, once people have actually tried things. Every quote is a real comment, copied word for word.</p>`;
  html += list.length ? list.map(s => `<section class="people"><div class="from">From ${short(s.date)} · ${esc(s.category)}</div>
      <h3><a href="#/day/${s.date}/${s.id}" style="text-decoration:none">${esc(s.headline)}</a></h3>${reactionBlock(s.reactions)}
      ${s.storyline?.days > 1 ? `<p><a class="linkish" href="#/storyline/${s.id}">🧵 Follow the whole storyline: ${esc(s.thread)}</a></p>` : ""}</section>`).join("")
    : `<p class="empty">No genuine discussion turned up for the previous day's stories yet.</p>`;
  $("#view").innerHTML = html;
}
function viewStorylines() {
  const ls = INDEX.storylines;
  $("#view").innerHTML = `<p class="lede">Stories that kept developing over several days, most recently active first.</p>` + (ls.length
    ? `<ul class="list">${ls.map(t => `<li><a href="#/storyline/${t.ids[t.ids.length - 1]}"><span class="d">${t.days} days · ${short(t.first)} → ${short(t.last)}</span>
       <span class="h">${esc(t.name)}</span><span class="s">Latest: ${esc(t.latest_headline)}</span></a></li>`).join("")}</ul>`
    : `<p class="empty">Storylines appear once a story continues over more than one day.</p>`);
}
async function viewStoryline(id) {
  const t = await api(`/api/storyline/${id}`);
  $("#view").innerHTML = `<h3 class="section">Storyline</h3><h2 style="font:700 30px/1.2 var(--display);margin:6px 0 4px">${esc(t.name)}</h2>
    <p class="lede">${t.items.length} reports from ${short(t.items[0].date)} to ${short(t.items[t.items.length - 1].date)}, oldest first.</p>
    <div class="timeline show" style="margin-top:22px">${t.items.map(m => `<div class="tl"><div class="when">${fmt(m.date)}</div>
      <div class="h" style="font-size:21px"><a href="${url(m.link)}" target="_blank" rel="noopener">${esc(m.headline)}</a></div>
      <p style="color:var(--ink);font-size:17px">${esc(m.summary)}</p>${reactionBlock(m.reactions, false)}
      <p><a class="more" href="#/day/${m.date}/${m.id}">See it in that day's edition →</a></p></div>`).join("")}</div>`;
}
async function viewWeek() {
  const day = INDEX.days.find(d => d.weekly);
  if (!day) { $("#view").innerHTML = `<p class="empty">Your first weekly recap arrives on Sunday.</p>`; return; }
  const d = await api(`/api/day/${day.date}`), w = d.weekly;
  $("#view").innerHTML = `<h3 class="section">The week in AI <small>${short(w.from)} – ${short(day.date)}</small></h3>
    <p class="recap">${esc(w.trend)}</p><h3 class="section">Stories that mattered most</h3>
    <ul class="list">${w.stories.map(s => `<li><a href="#/day/${s.date}/${s.id}"><span class="d">${short(s.date)} · ${esc(s.category)}</span>
    <span class="h">${esc(s.headline)}</span><span class="s">${esc(s.brief)}</span></a></li>`).join("")}</ul>`;
}
function viewArchive() {
  $("#view").innerHTML = `<ul class="list">${INDEX.days.map((d, i) => `<li><a href="#/day/${d.date}"><span class="d">${fmt(d.date)} · No. ${INDEX.days.length - i}${d.weekly ? " · weekly recap" : ""}</span>
    <span class="h">${esc(d.lead)}</span><span class="s">${d.count} stories</span></a></li>`).join("") || ""}</ul>` +
    (INDEX.days.length ? "" : `<p class="empty">No editions yet.</p>`);
}
function viewSearch(q) {
  const words = q.toLowerCase().split(/\s+/).filter(Boolean);
  const hits = INDEX.search.filter(s => { const t = [s.headline, s.brief, s.thread, s.technology, s.category].join(" ").toLowerCase();
    return words.every(w => t.includes(w)); }).reverse().slice(0, 80);
  const mark = t => { let h = esc(t); words.forEach(w => { h = h.replace(new RegExp(w.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"), "gi"), m => `<mark>${m}</mark>`); }); return h; };
  $("#view").innerHTML = `<p class="lede">${hits.length} result${hits.length === 1 ? "" : "s"} for “${esc(q)}” across every edition.</p>
    <ul class="list">${hits.map(s => `<li><a href="#/day/${s.date}/${s.id}"><span class="d">${short(s.date)} · ${esc(s.category)}</span>
    <span class="h">${mark(s.headline)}</span><span class="s">${mark(s.brief || "")}</span></a></li>`).join("")}</ul>`;
}

/* ---------- actions ---------- */
function expand(e, el) { if (e.target.closest("a,button,.open")) return; el.classList.toggle("expanded"); }
function toggleTl(e, id) { e.stopPropagation(); document.getElementById("tl-" + id).classList.toggle("show"); }
async function vote(e, id, k) {
  e.stopPropagation();
  const next = INDEX.feedback[id] === k ? null : k;
  INDEX.feedback[id] = next;
  e.target.parentElement.querySelectorAll("button").forEach(b => b.classList.toggle("on", next && b.getAttribute("onclick").includes(`'${next}'`)));
  try { await api("/api/feedback", {method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify({id, vote: next})}); }
  catch { alert("Couldn't save that. Is the app still running?"); }
}
async function sync() { $("#healthbox").innerHTML = ""; await api("/api/sync", {method:"POST"}); INDEX = await api("/api/index"); route(); }

/* ---------- router ---------- */
async function loadDay(date) {
  if (!DAY || DAY.date !== date) DAY = await api(`/api/day/${date}`);
  header(DAY); return DAY;
}
async function route() {
  const h = location.hash || "#/", parts = h.slice(2).split("/");
  const tab = {"": "today", day: "today", people: "people", storylines: "storylines", storyline: "storylines", week: "week", archive: "archive"}[parts[0]] || "";
  document.querySelectorAll("#tabs a").forEach(a => a.classList.toggle("on", a.dataset.t === tab));
  $("#healthbox").innerHTML = "";
  if (!INDEX.days.length) { $("#view").innerHTML = `<p class="empty">No editions yet. The first one arrives after the next 4 AM run, or start one from GitHub Actions.</p>`; setStatus(null); return; }
  const latest = INDEX.days[0].date;
  try {
    if (parts[0] === "search") { viewSearch(decodeURIComponent(parts.slice(1).join("/"))); return; }
    if (parts[0] === "" || parts[0] === "day") { CUR = parts[1] || latest; viewToday(await loadDay(CUR), parts[2]); if (!parts[2]) scrollTo(0, 0); return; }
    if (parts[0] === "people") { viewPeople(await loadDay(parts[1] || CUR || latest)); return; }
    await loadDay(CUR || latest);
    if (parts[0] === "storylines") viewStorylines();
    else if (parts[0] === "storyline") await viewStoryline(parts[1]);
    else if (parts[0] === "week") await viewWeek();
    else if (parts[0] === "archive") viewArchive();
    scrollTo(0, 0);
  } catch (err) { $("#view").innerHTML = `<p class="empty">Couldn't load that (${esc(err.message)}).</p>`; }
}
let qTimer; $("#q").addEventListener("input", e => { clearTimeout(qTimer); const v = e.target.value.trim();
  qTimer = setTimeout(() => go(v ? "#/search/" + encodeURIComponent(v) : "#/"), 250); });
document.querySelector('#tabs a[data-t="people"]').addEventListener("click", e => { e.preventDefault(); go("#/people/" + (CUR || INDEX.days[0]?.date || "")); });
window.addEventListener("hashchange", route);
(async () => { greet(); INDEX = await api("/api/index"); route(); })();
</script>
</body>
